<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .lang { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #333333; }
        .percent { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #666666; }
        .progress { height: 8px; rx: 4px; ry: 4px; }
        .bg { fill: #eeeeee; }
        .bar { rx: 4px; ry: 4px; }
    </style>
    
    <rect width="400" height="200" fill="#ffffff"/>
    
    <g transform="translate(25, 20)">
        <!-- PHP 60% -->
        <text class="lang" x="0" y="12">PHP</text>
        <rect class="progress bg" x="120" y="3" width="200" height="8"/>
        <rect class="progress bar" x="120" y="3" width="120" height="8" fill="#4F5D95"/>
        <text class="percent" x="330" y="12">60%</text>

        <!-- JavaScript 25% -->
        <g transform="translate(0,30)">
            <text class="lang" x="0" y="12">JavaScript</text>
            <rect class="progress bg" x="120" y="3" width="200" height="8"/>
            <rect class="progress bar" x="120" y="3" width="50" height="8" fill="#f1e05a"/>
            <text class="percent" x="330" y="12">25%</text>
        </g>

        <!-- Python 7% -->
        <g transform="translate(0,60)">
            <text class="lang" x="0" y="12">Python</text>
            <rect class="progress bg" x="120" y="3" width="200" height="8"/>
            <rect class="progress bar" x="120" y="3" width="14" height="8" fill="#3572A5"/>
            <text class="percent" x="330" y="12">7%</text>
        </g>

        <!-- Golang 5% -->
        <g transform="translate(0,90)">
            <text class="lang" x="0" y="12">Golang</text>
            <rect class="progress bg" x="120" y="3" width="200" height="8"/>
            <rect class="progress bar" x="120" y="3" width="10" height="8" fill="#00ADD8"/>
            <text class="percent" x="330" y="12">5%</text>
        </g>

        <!-- HTML 2% -->
        <g transform="translate(0,120)">
            <text class="lang" x="0" y="12">HTML</text>
            <rect class="progress bg" x="120" y="3" width="200" height="8"/>
            <rect class="progress bar" x="120" y="3" width="4" height="8" fill="#e34c26"/>
            <text class="percent" x="330" y="12">2%</text>
        </g>

        <!-- CSS 1% -->
        <g transform="translate(0,150)">
            <text class="lang" x="0" y="12">CSS</text>
            <rect class="progress bg" x="120" y="3" width="200" height="8"/>
            <rect class="progress bar" x="120" y="3" width="2" height="8" fill="#563d7c"/>
            <text class="percent" x="330" y="12">1%</text>
        </g>
    </g>
</svg>
